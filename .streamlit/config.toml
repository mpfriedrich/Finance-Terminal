[theme]
# The terminal look (audit 02.10.2026): black, amber first, square corners, one
# monospace family. Only [theme] changed then; [server] below is untouched.
base = "dark"
primaryColor = "#FF9E1B"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0B0B0B"
textColor = "#E8E8E8"
font = "monospace"
baseRadius = "none"
borderColor = "#242424"
greenColor = "#26D07C"
redColor = "#FF4B4B"
linkColor = "#FF9E1B"
showSidebarBorder = true
chartCategoricalColors = ["#FF9E1B", "#4DB8FF", "#26D07C", "#C792EA", "#F78C6C", "#FFCB6B", "#89DDFF", "#FF4B4B"]

[server]
headless = true
port = 8501
# Listen on every interface, not just the loopback, so a phone on the same wifi can
# reach the Mac. This is a home-network convenience, not a deployment: there is no
# login, so anyone on that network can open it.
address = "0.0.0.0"
# Only pages the app serves itself may talk to it. With CORS off (until 02.10.2026) any
# website open in the same browser could have opened a WebSocket to the app and read
# what it shows; there is no login to stop that.
enableCORS = true
# Host names the app answers to. Blocks DNS rebinding (a foreign domain re-pointed at
# this Mac). ".local" names resolve only inside the home network, so a phone reaches the
# app as http://<mac-name>.local:8501; a bare LAN IP is refused on purpose.
allowedHosts = ["localhost", "127.0.0.1", "*.local"]
enableXsrfProtection = true

[browser]
gatherUsageStats = false
